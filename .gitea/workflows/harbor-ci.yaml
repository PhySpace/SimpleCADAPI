name: Harbor CADIR benchmark

on:
  push:
    branches:
      - master
      - dev
      - ci/harbor-smoke
  workflow_dispatch:

concurrency:
  group: harbor-cadir-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Secrets and Docker access are limited to protected release branches,
    # plus this exact disposable branch for the initial runner smoke test.
    if: gitea.ref == 'refs/heads/master' || gitea.ref == 'refs/heads/dev' || (gitea.event_name == 'push' && gitea.ref == 'refs/heads/ci/harbor-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Check out the CADIR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Verify Docker runner
        run: docker info && docker compose version

      - name: Install pinned Harbor CLI
        run: uv tool install harbor==0.23.0

      - name: Run public Harbor Hub benchmark
        env:
          HARBOR_CI_DATASET: ${{ vars.CADIR_CI_DATASET }}
          HARBOR_CI_AGENT: ${{ vars.CADIR_CI_AGENT }}
          HARBOR_CI_AGENT_VERSION: ${{ vars.CADIR_CI_AGENT_VERSION }}
          HARBOR_CI_N_CONCURRENT: ${{ vars.CADIR_CI_N_CONCURRENT }}
          HARBOR_CI_N_ATTEMPTS: ${{ vars.CADIR_CI_N_ATTEMPTS }}
          HARBOR_CI_MAX_RETRIES: ${{ vars.CADIR_CI_MAX_RETRIES }}
          BENCH_MODEL: ${{ vars.CADIR_CI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.CADIR_CI_OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.CADIR_CI_OPENAI_BASE_URL }}
        run: python -m tools.harbor_ci.run --cleanup-runtime

      - name: Upload Harbor jobs and summary
        if: always()
        # Use the v3 artifact protocol until the runner/reverse-proxy path is
        # reliable with v4 CreateArtifact requests. The action code comes from
        # Gitea's mirror; the runner still uploads to this Gitea instance.
        uses: https://gitea.com/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: cadir-harbor-ci-${{ gitea.sha }}
          path: .harbor-ci/
          if-no-files-found: error
          # The complete Harbor output tree lives below this hidden directory.
          include-hidden-files: true
