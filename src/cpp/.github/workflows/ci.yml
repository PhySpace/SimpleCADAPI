name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64,   os: macos-14 }
          - { name: Linux x86_64,  os: ubuntu-24.04 }
          - { name: Linux aarch64, os: ubuntu-24.04-arm }
          - { name: Windows x64,   os: windows-2022 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache static OCCT
        id: occt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/occt
          key: occt-V7_9_3-${{ matrix.os }}-${{ hashFiles('tools/build_occt.py') }}
      - name: Install build tools
        shell: bash
        run: |
          python -m pip install -U pip pybind11 numpy pytest ninja cmake
      - name: Build OCCT (once per runner type)
        if: steps.occt.outputs.cache-hit != 'true'
        shell: bash
        run: python tools/build_occt.py --prefix "${{ runner.temp }}/occt"
      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSCAD_WARNINGS_AS_ERRORS=ON
          -DSCAD_OCCT_PREFIX="${{ runner.temp }}/occt"
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Build
        run: cmake --build build --parallel
      - name: C++ tests
        run: ctest --test-dir build --output-on-failure
      - name: Python tests
        shell: bash
        env:
          SCAD_BUILD_DIR: ${{ github.workspace }}/build
        run: python -m pytest tests/python -q
